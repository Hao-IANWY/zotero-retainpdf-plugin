[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retainpdf-ai-service"
version = "0.1.0"
description = "RetainPDF local agentic document service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115.0,<1",
  "httpx>=0.27.0,<1",
  "pydantic>=2.0,<3",
  "uvicorn>=0.30.0,<1",
  # uvicorn 默认不带 WebSocket 实现。fx 终端（/v1/fx/terminal）要它，
  # 少了这个依赖 WS 握手会静默降级成 404，而不是报缺依赖。
  "websockets>=12.0,<16",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
]

[project.scripts]
retainpdf-ai = "retainpdf_ai.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["retainpdf_ai*"]
