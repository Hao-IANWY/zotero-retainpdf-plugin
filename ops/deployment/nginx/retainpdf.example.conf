# RetainPDF host reverse proxy example for a single-user HTTPS deployment.
#
# Before enabling:
#   1. Replace pdf.example.com with the real domain.
#   2. Obtain the referenced TLS certificate.
#   3. Create /etc/nginx/retainpdf.htpasswd with `htpasswd`.
#   4. Keep Docker's web port bound to 127.0.0.1:40001.

upstream retainpdf_web {
    server 127.0.0.1:40001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name pdf.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pdf.example.com;

    ssl_certificate /etc/letsencrypt/live/pdf.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdf.example.com/privkey.pem;

    # RetainPDF currently exposes one backend workspace rather than isolated
    # user accounts. Do not publish it without an independent access gate.
    auth_basic "RetainPDF";
    auth_basic_user_file /etc/nginx/retainpdf.htpasswd;

    # Common proxy wiring inherited by every location below (nginx falls back
    # to server-level proxy_set_header only when a location defines none of
    # its own, so keep locations free of per-location proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    client_max_body_size 256m;

    # AI answers are SSE. Both this host proxy and the web-container proxy
    # must forward every committed chunk immediately. The backend also sends
    # X-Accel-Buffering: no on its SSE responses.
    location = /api/v1/ai/ask {
        proxy_pass http://retainpdf_web;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    # Task SSE streams (translation hints + progress events): one rule covers
    # both so a newly added stream endpoint cannot silently fall into the
    # buffered /api/ location. Durable keepalives must cross nginx immediately.
    location ~ ^/api/v1/jobs/[^/]+/(live-events|progress-events)$ {
        proxy_pass http://retainpdf_web;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    # Uploads are streamed to the application instead of being fully buffered
    # by the host proxy. Download responses remain streamable and retain Range.
    location /api/ {
        proxy_pass http://retainpdf_web;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_body_timeout 1h;
        send_timeout 1h;
    }

    location / {
        proxy_pass http://retainpdf_web;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
